function emptyState(){return {demo:false,products:[],sales:[],expenses:[],customers:[],payments:[],rewards:[],employees:[],attendance:[],advances:[]}}

function seed(){
  var st=emptyState(); st.demo=true;
  var seedN=11; function rnd(){seedN=(seedN*1664525+1013904223)%4294967296;return seedN/4294967296}
  var P=[['Sugar 1kg',95,115,40,10],['Cooking oil 1L',210,245,18,8],['Teff flour 1kg',85,102,30,10],['Bottled water 500ml',12,18,6,12],['Soap bar',22,30,50,10],['Coffee 250g',120,150,4,6],['Eggs (tray of 30)',330,390,9,4],['Pasta 500g',38,48,25,8]];
  P.forEach(function(p){st.products.push({id:uid(),name:p[0],cost:p[1],price:p[2],qty:p[3],low:p[4]})});
  var C=[['Abebe Kebede','0911 000 101'],['Meron Alemu','0911 000 102'],['Yonas Tadesse','0911 000 103'],['Tigist Haile','0911 000 104'],['Kebede Worku','0911 000 105']];
  C.forEach(function(c){st.customers.push({id:uid(),name:c[0],phone:c[1]})});
  var E=[['Hana Tesfaye','0911 000 201','Cashier',4500,-120],['Dawit Bekele','0911 000 202','Stock keeper',5200,-300],['Selam Girma','0911 000 203','Shop assistant',3800,-45]];
  E.forEach(function(e){st.employees.push({id:uid(),name:e[0],phone:e[1],role:e[2],salary:e[3],start:addDays(e[4]),status:'active'})});
  for(var d=20;d>=0;d--){
    var n=2+Math.floor(rnd()*3);
    for(var k=0;k<n;k++){
      var items=[],cnt=1+Math.floor(rnd()*3);
      for(var j=0;j<cnt;j++){var p=st.products[Math.floor(rnd()*st.products.length)];items.push({pid:p.id,name:p.name,qty:1+Math.floor(rnd()*3),price:p.price,cost:p.cost})}
      var credit=rnd()<0.28, cust=null;
      if(credit||rnd()<0.45){cust=st.customers[Math.floor(rnd()*st.customers.length)].id}
      var emp=st.employees[Math.floor(rnd()*st.employees.length)].id;
      st.sales.push({id:uid(),date:addDays(-d),time:pad(8+Math.floor(rnd()*11))+':'+pad(Math.floor(rnd()*60)),items:items,total:sum(items,function(i){return i.qty*i.price}),pay:credit?'credit':'cash',custId:cust,empId:emp});
    }
    if(d%4===0){st.expenses.push({id:uid(),desc:['Transport','Electricity','Packaging bags','Cleaning supplies'][d%3],amt:[120,350,90,150][d%4]||200,date:addDays(-d),cat:['Transport','Utilities','Supplies','Supplies'][d%3]})}
  }
  st.expenses.push({id:uid(),desc:'Monthly shop rent',amt:6000,date:addDays(-9),cat:'Rent'});
  var owed={}; st.sales.forEach(function(s){if(s.pay==='credit'){owed[s.custId]=(owed[s.custId]||0)+s.total}});
  Object.keys(owed).slice(0,3).forEach(function(cid,i){st.payments.push({id:uid(),custId:cid,amt:Math.round(owed[cid]*(0.35+i*0.15)),date:addDays(-3-i)})});
  for(var a=13;a>=0;a--){
    st.employees.forEach(function(e,ei){
      if(a===0&&ei>0)return;
      var r=rnd(),s=r<0.8?'present':r<0.9?'late':r<0.95?'absent':'leave';
      var rec={id:uid(),empId:e.id,date:addDays(-a),status:s};
      if(s==='present'||s==='late'){rec.in=s==='late'?'08:'+pad(40+Math.floor(rnd()*15)):'07:'+pad(45+Math.floor(rnd()*14));if(a>0)rec.out='18:'+pad(Math.floor(rnd()*30))}
      st.attendance.push(rec)});
  }
  var e0=st.employees[0].id,e1=st.employees[1].id,e2=st.employees[2].id;
  st.advances.push({id:uid(),empId:e0,type:'money',kind:'borrow',desc:'Cash advance',amt:800,date:addDays(-12)});
  st.advances.push({id:uid(),empId:e0,type:'money',kind:'repay',desc:'Repayment',amt:300,date:addDays(-5)});
  st.advances.push({id:uid(),empId:e1,type:'goods',kind:'borrow',desc:'Cooking oil 1L',amt:245,date:addDays(-7)});
  st.advances.push({id:uid(),empId:e2,type:'money',kind:'borrow',desc:'Transport money',amt:400,date:addDays(-3)});
  return st;
}

/* ---- calculations ---- */
var REWARD_PTS=10, REWARD_VAL=50;
function creditSales(cid){return S.sales.filter(function(s){return s.pay==='credit'&&s.custId===cid})}
function custBalance(cid){return Math.max(0,sum(creditSales(cid),function(s){return s.total})-sum(S.payments.filter(function(p){return p.custId===cid}),function(p){return p.amt}))}
function custStats(cid){
  var ss=S.sales.filter(function(s){return s.custId===cid});
  var spent=sum(ss,function(s){return s.total}), used=sum(S.rewards.filter(function(r){return r.custId===cid}),function(r){return r.points});
  var last=ss.reduce(function(m,s){return s.date>m?s.date:m},'');
  var tier=spent>=3000?'gold':spent>=1500?'silver':'member';
  return {spent:spent,count:ss.length,last:last,points:Math.max(0,Math.floor(spent/100)-used),balance:custBalance(cid),tier:tier,sales:ss};
}
function allocate(){
  var paid={},by={};
  S.sales.filter(function(s){return s.pay==='credit'&&s.custId}).sort(function(a,b){return (a.date+a.time).localeCompare(b.date+b.time)}).forEach(function(s){(by[s.custId]=by[s.custId]||[]).push(s)});
  Object.keys(by).forEach(function(cid){var pool=sum(S.payments.filter(function(p){return p.custId===cid}),function(p){return p.amt});
    by[cid].forEach(function(s){var a=Math.min(pool,s.total);paid[s.id]=a;pool-=a})});
  return paid;
}
function empAdv(eid){var l=S.advances.filter(function(a){return a.empId===eid});
  return {borrowed:sum(l.filter(function(a){return a.kind==='borrow'}),function(a){return a.amt}),repaid:sum(l.filter(function(a){return a.kind==='repay'}),function(a){return a.amt}),
  get balance(){return Math.max(0,this.borrowed-this.repaid)}}}
function empById(id){return S.employees.find(function(e){return e.id===id})}
function custById(id){return S.customers.find(function(c){return c.id===id})}
function activeEmps(){return S.employees.filter(function(e){return e.status==='active'})}
function attSummary(eid,month){
  var l=S.attendance.filter(function(a){return a.empId===eid&&a.date.indexOf(month)===0});
  var c={present:0,late:0,absent:0,leave:0};l.forEach(function(a){c[a.status]++});
  var base=c.present+c.late+c.absent; c.rate=base?Math.round((c.present+c.late)/base*100):null; return c;
}
function periodSales(from){return S.sales.filter(function(s){return s.date>=from})}
function cogs(ss){return sum(ss,function(s){return sum(s.items,function(i){return i.cost*i.qty})})}

function vReports(){
  var days=ui.period, from=addDays(1-(days===1?1:days)); if(days===1)from=today();
  var ss=periodSales(from), rev=sum(ss,function(s){return s.total}), cg=cogs(ss), gp=rev-cg;
  var ex=sum(S.expenses.filter(function(e){return e.date>=from}),function(e){return e.amt});
  var cashS=sum(ss.filter(function(s){return s.pay==='cash'}),function(s){return s.total}), crS=rev-cashS;
  var h=seg('period',[['1','Today'],['7','Last 7 days'],['30','Last 30 days']],String(days));
  h+='<section class="card">'+secH('Sales summary')+
   [['Sales',rev],['Cash sales',cashS],['Credit sales',crS],['Cost of goods sold',cg],['Gross profit',gp],['Expenses',ex]].map(function(r){return '<div class="sum-line"><span>'+esc(t(r[0]))+'</span><b>'+money(r[1])+'</b></div>'}).join('')+
   '<div class="sum-line tot"><span>Estimated result after expenses</span><b>'+money(gp-ex)+'</b></div><small>Credit sales are not cash collected. Figures are estimates from recorded sales and costs.</small></section>';
  var bars=[],mx=1;for(var i=6;i>=0;i--){var dd=addDays(-i),v=sum(S.sales.filter(function(s){return s.date===dd}),function(s){return s.total});bars.push([dd,v]);mx=Math.max(mx,v)}
  h+='<section class="card">'+secH('Last 7 days')+'<div class="bars">'+bars.map(function(b){return '<div><em>'+Math.round(b[1])+'</em><i style="height:'+Math.max(3,Math.round(b[1]/mx*86))+'px"></i><small>'+new Date(b[0]+'T00:00:00').toLocaleDateString('en-GB',{weekday:'short'})+'</small></div>'}).join('')+'</div></section>';
  var m=today().slice(0,7);
  h+='<section class="card">'+secH('Attendance this month')+'<div class="table-wrap"><table><thead><tr><th>'+esc(t('Employee'))+'</th><th>'+esc(t('Present'))+'</th><th>'+esc(t('Late'))+'</th><th>'+esc(t('Absent'))+'</th><th>'+esc(t('Leave'))+'</th><th>Rate</th></tr></thead><tbody>'+
   (S.employees.length?S.employees.map(function(e){var c=attSummary(e.id,m);return '<tr><td>'+esc(e.name)+'</td><td>'+c.present+'</td><td>'+c.late+'</td><td>'+c.absent+'</td><td>'+c.leave+'</td><td>'+(c.rate==null?'–':c.rate+'%')+'</td></tr>'}).join(''):'<tr><td colspan="6">No employees</td></tr>')+'</tbody></table></div></section>';
  h+='<section class="card">'+secH('Outstanding employee advances')+'<div class="table-wrap"><table><thead><tr><th>'+esc(t('Employee'))+'</th><th>Taken</th><th>Repaid</th><th>Balance</th></tr></thead><tbody>'+
   S.employees.map(function(e){var a=empAdv(e.id);return '<tr><td>'+esc(e.name)+'</td><td>'+money(a.borrowed)+'</td><td>'+money(a.repaid)+'</td><td><b>'+money(a.balance)+'</b></td></tr>'}).join('')+'</tbody></table></div></section>';
  var paid=allocate();
  h+='<section class="card">'+secH('Credit given by employees')+'<div class="table-wrap"><table><thead><tr><th>'+esc(t('Employee'))+'</th><th>Sales</th><th>Credit given</th><th>Still open</th></tr></thead><tbody>'+
   S.employees.map(function(e){var cs=S.sales.filter(function(s){return s.empId===e.id&&s.pay==='credit'&&s.custId});var g=sum(cs,function(s){return s.total}),o=sum(cs,function(s){return s.total-(paid[s.id]||0)});return '<tr><td>'+esc(e.name)+'</td><td>'+cs.length+'</td><td>'+money(g)+'</td><td><b>'+money(o)+'</b></td></tr>'}).join('')+'</tbody></table></div><small>Customer payments are applied to the oldest credit sale first.</small></section>';
  var tc=S.customers.map(function(c){return {c:c,s:custStats(c.id)}}).filter(function(x){return x.s.count>0}).sort(function(a,b){return b.s.spent-a.s.spent}).slice(0,5);
  h+='<section class="card">'+secH('Top customers')+(tc.length?'<div class="list">'+tc.map(function(x,i){return '<button class="row" data-act="custDetail" data-id="'+x.c.id+'"><div class="grow"><b>'+(i+1)+'. '+esc(x.c.name)+'</b><small>'+x.s.count+' purchases'+(x.s.balance>0?' · owes '+money(x.s.balance):'')+'</small></div><div class="end"><b>'+money(x.s.spent)+'</b><br>'+pill(cap(x.s.tier),x.s.tier)+'</div></button>'}).join('')+'</div>':empty('No customer purchases yet.'))+'</section>';
  h+='<button class="btn ghost block" data-act="copyReport">Copy report summary</button>';
  return h;
}

function addLine(){
  var p=S.products.find(function(x){return x.id===$('sPid').value}),q=Math.floor(num($('sQty').value));
  if(!p||q<1){toast('Choose a product and quantity');return}
  var ex=cart.find(function(i){return i.pid===p.id}),have=(ex?ex.qty:0)+q;
  if(have>p.qty){toast('Only '+p.qty+' of '+p.name+' in stock');return}
  if(ex)ex.qty=have;else cart.push({pid:p.id,name:p.name,qty:q,price:p.price,cost:p.cost});
  $('sQty').value='1';renderCart();
}
function submitSale(){
  if(!cart.length){toast('Add at least one item');return}
  var pay=document.querySelector('input[name="pay"]:checked').value,cid=$('sCust').value,nn=$('sNew').value.trim();
  if(nn){var c={id:uid(),name:nn,phone:''};S.customers.push(c);cid=c.id}
  if(pay==='credit'&&!cid){toast('Choose or add the customer who owes this');return}
  cart.forEach(function(i){var p=S.products.find(function(x){return x.id===i.pid});if(p)p.qty-=i.qty});
  S.sales.push({id:uid(),date:today(),time:nowHM(),items:cart.slice(),total:sum(cart,function(i){return i.qty*i.price}),pay:pay,custId:cid||null,empId:$('sEmp').value||null});
  cart=[];done('Sale saved');
}

   '<button class="btn ghost block" data-act="backup">Copy backup text</button>'+
   '<div class="field"><label for="restoreTxt">Restore from pasted backup text</label><textarea id="restoreTxt" rows="3" placeholder="Paste backup text here"></textarea></div><button class="btn ghost block" data-act="restore">Restore from text</button>'+
   '<button class="btn danger block" data-act="freshEmpty">Start with an empty shop</button><button class="btn ghost block" data-act="freshSample">Load sample shop data</button></div>');
}

/* ---- form submit ---- */
function submitForm(f){
  var k=f.dataset.form,id=f.dataset.id;
  if(k==='sale')return submitSale();
  if(k==='product'){var p=id?S.products.find(function(x){return x.id===id}):null;
    var d={name:$('pName').value.trim(),cost:num($('pCost').value),price:num($('pPrice').value),qty:Math.floor(num($('pQty').value)),low:Math.floor(num($('pLow').value))};
    if(!d.name)return;if(p){Object.assign(p,d);p.qty+=Math.floor(num(($('pAdd')||{}).value))}else S.products.push(Object.assign({id:uid()},d));return done('Product saved')}
  if(k==='expense'){var a=num($('xAmt').value);if(!$('xDesc').value.trim()||a<=0)return;S.expenses.push({id:uid(),desc:$('xDesc').value.trim(),amt:a,date:$('xDate').value||today(),cat:$('xCat').value});return done('Expense saved')}
  if(k==='customer'){if(!$('cName').value.trim())return;S.customers.push({id:uid(),name:$('cName').value.trim(),phone:$('cPhone').value.trim()});return done('Customer added')}
  if(k==='payment'){var amt=num($('payAmt').value);if(amt<=0)return;S.payments.push({id:uid(),custId:id,amt:Math.min(amt,custBalance(id)),date:$('payDate').value||today()});return done('Payment recorded')}
  if(k==='employee'){var e=id?empById(id):null,v={name:$('eName').value.trim(),phone:$('ePhone').value.trim(),role:$('eRole').value.trim(),salary:num($('eSal').value),start:$('eStart').value||today(),status:$('eStat').value};
    if(!v.name||!v.role)return;if(e)Object.assign(e,v);else S.employees.push(Object.assign({id:uid()},v));return done('Employee saved')}
  if(k==='advance'){var am=num($('aAmt').value),ty=$('aType').value;if(am<=0)return;var ds=$('aDesc').value.trim();if(ty==='goods'&&!ds){toast('Say which goods were taken');return}
    S.advances.push({id:uid(),empId:$('aEmp').value,type:ty,kind:$('aKind').value,desc:ds||(ty==='money'?'Cash':''),amt:am,date:$('aDate').value||today()});return done('Advance recorded')}
}

/* ---- attendance ---- */
function setAtt(eid,d,st){
  var r=S.attendance.find(function(a){return a.empId===eid&&a.date===d});
  if(!r){r={id:uid(),empId:eid,date:d,status:st};S.attendance.push(r)}else r.status=st;
  if((st==='present'||st==='late')&&!r.in&&d===today())r.in=nowHM();
  if(st==='absent'||st==='leave'){delete r.in;delete r.out}
  save();render();
}
function stamp(eid,d,field){
  var r=S.attendance.find(function(a){return a.empId===eid&&a.date===d});
  if(!r){r={id:uid(),empId:eid,date:d,status:'present'};S.attendance.push(r)}
  if(field==='out'&&!r.in){toast('Check in first');return}
  if(r.status==='absent'||r.status==='leave')r.status='present';
  r[field]=nowHM();save();render();toast(field==='in'?'Checked in':'Checked out');
}

/* ---- clipboard ---- */
function copyText(txt,ok){
  function fb(){var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(ok)}catch(e){toast('Copy is not available here')}ta.remove()}
  try{navigator.clipboard.writeText(txt).then(function(){toast(ok)},fb)}catch(e){fb()}
}
function reportText(){
  var m=today().slice(0,7),L=['MizanBiz report '+today(),''];
  var ss=periodSales(addDays(-6)),rev=sum(ss,function(s){return s.total});L.push('Last 7 days: sales '+money(rev)+', gross profit '+money(rev-cogs(ss)));
  L.push('','Attendance this month:');S.employees.forEach(function(e){var c=attSummary(e.id,m);L.push('- '+e.name+': present '+c.present+', late '+c.late+', absent '+c.absent+', leave '+c.leave)});
  L.push('','Employee advances owed:');S.employees.forEach(function(e){L.push('- '+e.name+': '+money(empAdv(e.id).balance))});
  L.push('','Top customers:');S.customers.map(function(c){return {c:c,s:custStats(c.id)}}).sort(function(a,b){return b.s.spent-a.s.spent}).slice(0,5).forEach(function(x){L.push('- '+x.c.name+': '+money(x.s.spent))});
  return L.join('\n');
}

/* ---- theme ---- */
var THEME_KEY='mizanbiz_theme', AUTO_KEY='mizanbiz_cloud_auto';
function getPref(){try{return localStorage.getItem(THEME_KEY)||'system'}catch(e){return 'system'}}
function applyTheme(p){var r=document.documentElement;if(p==='light'||p==='dark')r.setAttribute('data-mz',p);else r.removeAttribute('data-mz');try{localStorage.setItem(THEME_KEY,p)}catch(e){}}
function effTheme(){var r=document.documentElement,m=r.getAttribute('data-mz');if(m)return m;var h=r.getAttribute('data-theme');if(h==='dark'||h==='light')return h;return (window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'}

/* ---- cloud backup (private to the signed-in viewer, stored with the page's db capability) ---- */
var cloud={db:null,uid:null,checked:false,meta:null,busy:false,again:false,err:'',dirty:false,auto:true,offer:false,guard:false,timer:null};
var CHUNK=80000;
function fmtAt(iso){try{return new Date(iso).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}catch(e){return ''}}
function colRef(){return cloud.db.collection('data/users/'+cloud.uid)}
function errMsg(e){var c=e&&e.code;
  if(c==='quota_exceeded')return 'Cloud storage is full.';
  if(c==='invalid_argument')return 'This account cannot save a cloud backup. Ask the owner for Contributor access.';
  if(c==='incomplete'||c==='invalid'||c==='nometa')return 'The cloud backup is missing or damaged. Back up again from the device with the good data.';
  if(c==='revoked')return 'Access to cloud backup ended.';
  return 'Could not reach the cloud. Check the connection and try again.'}
function cloudInit(){
  if(!(window.claude&&window.claude.use)){cloud.checked=true;return}
  Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
    if(!r[0]||!r[1])return;
    return r[1].id().then(function(id){
      if(!id)return;cloud.db=r[0];cloud.uid=id;
      return colRef().doc('backup-meta').get().then(function(m){cloud.meta=m.exists?m.data():null});
    });
  }).catch(function(e){cloud.err=errMsg(e)}).then(function(){
    cloud.checked=true;
    try{cloud.auto=localStorage.getItem(AUTO_KEY)!=='0'}catch(e){}
    cloud.offer=!!(cloud.db&&cloud.meta&&!hadLocal);cloud.guard=cloud.offer;
    refreshCloudUI();
  });
}
function cloudBackup(manual){
  if(!cloud.db){if(manual)toast('Cloud backup is not available here');return Promise.resolve(false)}
  if(cloud.busy){cloud.again=true;return Promise.resolve(false)}
  cloud.busy=true;cloud.err='';refreshCloudUI();
  var json=JSON.stringify(S),parts=[],i;
  for(i=0;i<json.length;i+=CHUNK)parts.push(json.slice(i,i+CHUNK));
  var slot=(cloud.meta&&cloud.meta.slot==='a')?'b':'a',col=colRef(),chain=Promise.resolve();
  parts.forEach(function(p,ix){chain=chain.then(function(){return col.doc('backup-'+slot+'-'+ix).set({i:ix,text:p})})});
  var meta={at:new Date().toISOString(),slot:slot,parts:parts.length,bytes:json.length,sales:S.sales.length,products:S.products.length,employees:S.employees.length};
  chain=chain.then(function(){return col.doc('backup-meta').set(meta)});
  return chain.then(function(){
    cloud.meta=meta;cloud.dirty=false;cloud.guard=false;cloud.offer=false;cloud.busy=false;
    if(manual)toast('Backed up to the cloud');
    refreshCloudUI();if(cloud.again){cloud.again=false;scheduleAuto()}return true;
  },function(e){cloud.busy=false;cloud.err=errMsg(e);refreshCloudUI();toast(cloud.err);return false});
}
function cloudRestore(){
  if(!cloud.db||cloud.busy)return;
  cloud.busy=true;cloud.err='';refreshCloudUI();var col=colRef();
  col.doc('backup-meta').get().then(function(m){
    if(!m.exists)throw {code:'nometa'};
    var meta=m.data(),reads=[],i;
    for(i=0;i<meta.parts;i++)reads.push(col.doc('backup-'+meta.slot+'-'+i).get());
    return Promise.all(reads).then(function(snaps){
      var txt=snaps.map(function(sn){if(!sn.exists)throw {code:'incomplete'};return sn.data().text}).join('');
      var o;try{o=JSON.parse(txt)}catch(x){throw {code:'invalid'}}
      if(!o||!Array.isArray(o.products)||!Array.isArray(o.sales))throw {code:'invalid'};
      S=Object.assign(emptyState(),o);save(true);cloud.meta=meta;cloud.dirty=false;cloud.guard=false;cloud.offer=false;
    });
  }).then(function(){cloud.busy=false;closeSheet();render();toast('Restored from cloud backup')},
    function(e){cloud.busy=false;cloud.err=errMsg(e);refreshCloudUI();toast(cloud.err)});
}
function scheduleAuto(){clearTimeout(cloud.timer);cloud.timer=setTimeout(function(){cloudBackup(false)},15000)}
function hookSaved(){cloud.dirty=true;if(cloud.auto&&cloud.db&&!cloud.guard)scheduleAuto()}
function cloudStatus(){
  if(!cloud.checked)return {k:'',t:'Checking cloud backup…'};
  if(!cloud.db)return {k:'bad',t:cloud.err||'Cloud backup needs you to be signed in to Claude with access to this page.'};
  if(cloud.busy)return {k:'warn',t:'Working with the cloud…'};
  if(cloud.err)return {k:'bad',t:cloud.err};
  if(!cloud.meta)return {k:'warn',t:'No cloud backup yet.'};
  return {k:cloud.dirty?'warn':'ok',t:'Last backup '+fmtAt(cloud.meta.at)+' · '+cloud.meta.sales+' sales'+(cloud.dirty?'. Newer changes are not backed up yet.':'.')};
}
function cloudBoxInner(){
  var s=cloudStatus();
  return '<div class="cloud"><div class="st"><span class="dot '+s.k+'"></span><span>'+esc(s.t)+'</span></div>'+(cloud.db?
   '<button class="btn block" data-act="cloudBackup"'+(cloud.busy?' disabled':'')+'>'+esc(t('Back up now'))+'</button>'+
   '<button class="btn ghost block" data-act="cloudRestore"'+(cloud.busy||!cloud.meta?' disabled':'')+'>Restore from cloud backup</button>'+
   '<button class="btn ghost block" data-act="cloudAuto">Automatic backup: '+(cloud.auto?'On':'Off')+'</button>'+
   '<small>Your backup is private to your Claude account. Automatic backup runs about 15 seconds after you save a change. Deleting this page deletes its backups.</small>':'')+'</div>';
}
function cloudCard(){
  if(!cloud.checked||!cloud.db)return '';
  var s=cloudStatus();
  return '<section class="card cloud"><div class="sec-h"><h2>'+esc(t('Cloud backup'))+'</h2></div><div class="st"><span class="dot '+s.k+'"></span><span>'+esc(s.t)+'</span></div><button class="btn ghost" data-act="cloudBackup"'+(cloud.busy?' disabled':'')+'>'+ic('cloud')+esc(t('Back up now'))+'</button></section>';
}
function cloudBanner(){
  if(!cloud.offer||!cloud.meta)return '';
  return '<div class="banner"><b>A cloud backup from '+esc(fmtAt(cloud.meta.at))+' was found.</b><span>It has '+cloud.meta.sales+' sales and '+cloud.meta.products+' products. Restore it to replace the sample data on this device.</span><div class="row2"><button class="btn" data-act="cloudRestore">Restore it</button><button class="btn ghost" data-act="cloudDismiss">Not now</button></div></div>';
}
function refreshCloudUI(){var b=$('cloudBox');if(b)b.innerHTML=cloudBoxInner();if(ui.tab==='home')render()}

/* ---- events ---- */
var ACT={
  tab:function(d){ui.tab=d.k;ui.q='';render();window.scrollTo(0,0)},
  sub:function(d){if(d.g==='period')ui.period=parseInt(d.k,10);else{ui.sub[d.g]=d.k;ui.q=''}render()},
  goPeople:function(d){ui.tab='people';ui.sub.people=d.k;render();window.scrollTo(0,0)},
  lang:function(){lang=lang==='am'?'en':'am';render()},
  settings:settingsSheet, closeSheet:closeSheet,
  newSale:saleSheet, addLine:addLine, rmLine:function(d){cart.splice(+d.i,1);renderCart()},
  addProduct:function(){productSheet()}, editProduct:function(d){productSheet(d.id)},
  addExpense:expenseSheet, addCustomer:customerSheet, custDetail:function(d){custDetail(d.id)},
  payFor:function(d){paySheet(d.id)},
  reward:function(d){var s=custStats(d.id);if(s.points<REWARD_PTS)return;S.rewards.push({id:uid(),custId:d.id,points:REWARD_PTS,value:REWARD_VAL,date:today()});save();custDetail(d.id);render();toast('Reward of '+money(REWARD_VAL)+' given')},
  addEmployee:function(){employeeSheet()}, editEmployee:function(d){employeeSheet(d.id)}, addAdvance:advanceSheet,
  setAtt:function(d){setAtt(d.emp,d.date,d.st)}, checkIn:function(d){stamp(d.emp,d.date,'in')}, checkOut:function(d){stamp(d.emp,d.date,'out')},
  del:function(d,el){
    if(!el.dataset.armed){el.dataset.armed='1';el.textContent=t('Tap again to delete');return}
    S[d.kind]=S[d.kind].filter(function(x){return x.id!==d.id});save();closeSheet();render();toast('Deleted')},
  themeToggle:function(){applyTheme(effTheme()==='dark'?'light':'dark');render();var sg=$('themeSeg');if(sg)sg.querySelectorAll('.seg').forEach(function(b){b.classList.toggle('on',b.dataset.k===getPref())})},
  theme:function(d){applyTheme(d.k);render();var sg=$('themeSeg');if(sg)sg.querySelectorAll('.seg').forEach(function(b){b.classList.toggle('on',b.dataset.k===d.k)})},
  cloudBackup:function(d,el){if(cloud.guard&&!el.dataset.armed){el.dataset.armed='1';el.textContent='Tap again to replace the cloud backup with this device';return}cloudBackup(true)},
  cloudRestore:function(d,el){if(!cloud.offer&&!el.dataset.armed){el.dataset.armed='1';el.textContent='Tap again to replace data on this device';return}cloudRestore()},
  cloudAuto:function(){cloud.auto=!cloud.auto;try{localStorage.setItem(AUTO_KEY,cloud.auto?'1':'0')}catch(e){}if(cloud.auto&&cloud.dirty&&!cloud.guard)scheduleAuto();refreshCloudUI()},
  cloudDismiss:function(){cloud.offer=false;cloud.guard=false;render();toast('Automatic backup will use this device\'s data')},
  copyReport:function(){copyText(reportText(),'Report summary copied')},
  backup:function(){copyText(JSON.stringify(S),'Backup copied')},
  restore:function(){try{var o=JSON.parse($('restoreTxt').value);if(!o||!o.products||!o.sales)throw 0;S=Object.assign(emptyState(),o);save();closeSheet();render();toast('Backup restored')}catch(e){toast('That is not a valid backup')}},
  freshEmpty:function(d,el){if(!el.dataset.armed){el.dataset.armed='1';el.textContent='Tap again to erase everything';return}S=emptyState();save();closeSheet();render();toast('Shop is now empty')},
  freshSample:function(d,el){if(!el.dataset.armed){el.dataset.armed='1';el.textContent='Tap again to replace current data';return}S=seed();save();closeSheet();render();toast('Sample data loaded')}
};
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(el&&ACT[el.dataset.act]){ACT[el.dataset.act](el.dataset,el);return}
  if(e.target===$('scrim'))closeSheet();
});
document.addEventListener('submit',function(e){var f=e.target.closest('form[data-form]');if(f){e.preventDefault();submitForm(f)}});
document.addEventListener('input',function(e){
  var l=e.target.dataset&&e.target.dataset.live;if(!l)return;
  ui.q=e.target.value;$('liveList').innerHTML=l==='stock'?productList():custList();
});
document.addEventListener('change',function(e){if(e.target.dataset&&e.target.dataset.actChange==='attDate'){ui.attDate=e.target.value||today();var l=$('attList');if(l)l.innerHTML=activeEmps().map(function(x){return attRow(x,ui.attDate,true)}).join('')}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('scrim').hidden)closeSheet()});

load();applyTheme(getPref());
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render)}catch(e){}
render();cloudInit();
})();
</script>
