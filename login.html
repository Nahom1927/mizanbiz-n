<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MizanBiz</title>
<style>
:root{
--bg:#F2F7F6;--card:#FFFFFF;--text:#0F2420;--mute:#5A716D;--line:#D3E2DF;
--p1:#0A8575;--p2:#075F54;--ok:#1B8A4B;--warn:#A9650B;--bad:#BB3A34;
--shadow:0 1px 2px rgba(15,36,32,.06),0 6px 18px rgba(15,36,32,.06);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media(prefers-color-scheme:dark){
:root:not([data-theme="light"]):not([data-mz="light"]){
--bg:#0B1614;--card:#122220;--text:#E5F2EF;--mute:#8FA9A4;--line:#244039;
--p1:#2EC4AE;--p2:#0F6F63;--ok:#5BD08C;--warn:#F0B45A;--bad:#F2827B;
--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);color-scheme:dark
}}
:root[data-theme="dark"]:not([data-mz="light"]),:root[data-mz="dark"]{
--bg:#0B1614;--card:#122220;--text:#E5F2EF;--mute:#8FA9A4;--line:#244039;
--p1:#2EC4AE;--p2:#0F6F63;--ok:#5BD08C;--warn:#F0B45A;--bad:#F2827B;
--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);color-scheme:dark
}
:root[data-theme="light"],:root[data-mz="light"]{color-scheme:light}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{margin:0 0 .4em;letter-spacing:-.02em}
.grad{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff}
.btn{border:0;border-radius:12px;padding:.7rem 1.2rem;font:600 .95rem inherit;font-family:inherit;cursor:pointer;transition:transform .15s,box-shadow .15s,opacity .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(10,133,117,.25)}.btn:active{transform:none}
.btn.pri{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff}
.btn.sec{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.ok{background:var(--ok);color:#fff}.btn.bad{background:var(--bad);color:#fff}.btn.sm{padding:.4rem .8rem;font-size:.85rem}
.btn.full{width:100%}
input,select{width:100%;padding:.75rem .9rem;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);font:inherit;margin:.25rem 0 .9rem}
input:focus,select:focus{outline:2px solid var(--p1);outline-offset:1px}
label{font-size:.85rem;font-weight:600;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:1.3rem;box-shadow:var(--shadow);animation:up .4s ease both}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.mute{color:var(--mute);font-size:.9rem}.err{color:var(--bad);font-size:.88rem;min-height:1.3em;margin:0 0 .5rem}.okmsg{color:var(--ok)}
.badge{display:inline-block;padding:.15rem .6rem;border-radius:99px;font-size:.78rem;font-weight:700}
.b-ok{background:#16a34a22;color:var(--ok)}.b-warn{background:#d9770622;color:var(--warn)}.b-bad{background:#dc262622;color:var(--bad)}
/* auth */
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.hero{padding:3rem;display:flex;flex-direction:column;justify-content:center;gap:1rem}
.hero h1{font-size:2.6rem;line-height:1.1}
.hero .pill{background:#ffffff2e;border-radius:16px;padding:1rem 1.2rem;backdrop-filter:blur(6px);max-width:420px}
.formwrap{display:flex;align-items:center;justify-content:center;padding:2rem}
.formwrap .card{width:100%;max-width:400px}
.tabs{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:1.2rem}
.tabs button{flex:1;border:0;background:none;color:var(--mute);padding:.6rem;border-radius:9px;font:600 .95rem inherit;font-family:inherit;cursor:pointer}
.tabs button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.link{background:none;border:0;color:var(--p1);cursor:pointer;font:inherit;padding:0}
/* app */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--card);border-right:1px solid var(--line);padding:1.2rem;display:flex;flex-direction:column;gap:.3rem;position:sticky;top:0;height:100vh}
.logo{font-size:1.4rem;font-weight:800;background:linear-gradient(135deg,var(--p1),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:1rem}
.nav{display:flex;align-items:center;gap:.7rem;padding:.7rem .9rem;border-radius:12px;border:0;background:none;color:var(--mute);font:600 .95rem inherit;font-family:inherit;cursor:pointer;text-align:left;transition:.2s}
.nav:hover{background:var(--bg);color:var(--text)}.nav.on{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff}
.main{padding:1.5rem;max-width:1000px;width:100%}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.2rem;gap:1rem}
.stat b{font-size:1.7rem;display:block}
.banner{border-radius:18px;padding:1.2rem 1.4rem;margin-bottom:1rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;animation:up .4s ease both}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:.55rem .4rem;border-bottom:1px solid var(--line);font-size:.92rem}
.scroll{overflow-x:auto}
.pay{border:1px dashed var(--p1);border-radius:14px;padding:1rem;margin-bottom:.8rem}
.pay code{background:var(--bg);padding:.15rem .5rem;border-radius:8px;font-weight:700;user-select:all}
footer{padding:1.5rem;text-align:center;color:var(--mute);font-size:.85rem;border-top:1px solid var(--line);margin-top:2rem}
footer b{color:var(--text)}
@media(max-width:800px){
.auth{grid-template-columns:1fr}.hero{padding:2rem 1.2rem}.hero h1{font-size:2rem}
.app{grid-template-columns:1fr}
.side{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;justify-content:space-around;padding:.4rem .4rem calc(.4rem + env(safe-area-inset-bottom,0px));z-index:20;border-right:0;border-top:1px solid var(--line)}
.side .logo,.side .hide-m{display:none}.nav{flex-direction:column;gap:.1rem;font-size:.7rem;padding:.4rem .5rem;text-align:center}
.main{padding:1rem 1rem 6rem}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const $=s=>document.querySelector(s),DAY=864e5;
const ADMIN_EMAIL='admin@mizanbiz.com';
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function hash(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('mb:'+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(p)}}
const users=()=>ld('mb_users',{}),me=()=>users()[ld('mb_session',null)];
const saveUser=u=>{const all=users();all[u.email]=u;sv('mb_users',all)};
let view='dash',mode='login',msg='';
const fmt=t=>new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
let usdPerEtb=0.0,fxUpdated=null;
async function loadFx(){
 try{
  const r=await fetch('https://open.er-api.com/v6/latest/ETB',{cache:'no-store'});
  if(!r.ok)throw new Error('rate unavailable');
  const j=await r.json(),rate=Number(j?.rates?.USD);
  if(!j||j.result!=='success'||!(rate>0))throw new Error('invalid rate');
  usdPerEtb=rate;fxUpdated=Date.now();sv('mb_fx',{rate:usdPerEtb,updated:fxUpdated});
 }catch(e){
  const cached=ld('mb_fx',null);
  if(cached&&Number(cached.rate)>0){usdPerEtb=Number(cached.rate);fxUpdated=cached.updated||null;}
 }
}
function currency(){return ld('mb_currency','ETB')}
function setCurrency(v){sv('mb_currency',v);render()}
function money(etb){
 const n=Number(etb)||0;
 if(currency()==='USD'&&usdPerEtb>0)return 'USD '+(n*usdPerEtb).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
 return 'ETB '+n.toLocaleString(undefined,{maximumFractionDigits:2});
}
function usdEquivalent(etb){return usdPerEtb>0?' (≈ USD '+(Number(etb)*usdPerEtb).toFixed(2)+')':' (USD rate unavailable)';}
function validLoginId(v){return /^\\S+@\\S+\\.\\S+$/.test(v)||/^\\+?[0-9][0-9\\s()-]{6,19}$/.test(v);}
function status(u){const n=Date.now(),te=u.created+90*DAY;
 if(u.subUntil>n)return{ok:1,label:'Premium active',cls:'b-ok',until:u.subUntil,days:Math.ceil((u.subUntil-n)/DAY)};
 if(te>n)return{ok:1,label:'Free trial',cls:'b-warn',until:te,days:Math.ceil((te-n)/DAY)};
 return{ok:0,label:'Expired',cls:'b-bad',until:te,days:0}}

function footer(){return `<footer><b>SASI DEVELOPERS</b> · Software Development Company<br>Developer: Nahom Zewge · CTO<br>Developer contact: <a href="tel:+251911898184" style="color:inherit;text-decoration:none">+251911898184</a><br>© 2026 SASI DEVELOPERS. All Rights Reserved.</footer>`}

function authView(){
 const reg=mode==='register',forgot=mode==='forgot';
 return `<div class="auth"><div class="hero grad"><div class="logo-w" style="font-weight:800;font-size:1.2rem">MizanBiz</div>
 <h1>Run your business with clarity.</h1><p style="opacity:.9;max-width:440px">Track income and expenses, see your balance at a glance, and grow with confidence.</p>
 <div class="pill"><b>🎁 3 Months Free</b><br>Full access to MizanBiz for the first 90 days after registration.</div>
 <div style="margin-top:auto;font-size:.82rem;opacity:.85">SASI DEVELOPERS · Software Development Company<br>Developer: Nahom Zewge · CTO<br>Contact: <a href="tel:+251911898184" style="color:inherit;text-decoration:underline">+251911898184</a><br>© 2026 SASI DEVELOPERS. All Rights Reserved.</div></div>
 <div class="formwrap"><div class="card">
 ${forgot?'<h2>Reset password</h2><p class="mute">Enter your account email and a new password.</p>':`<div class="tabs"><button class="${!reg?'on':''}" onclick="setMode('login')">Login</button><button class="${reg?'on':''}" onclick="setMode('register')">Create Account</button></div>`}
 ${reg?'<label>Full name</label><input id="f_name" autocomplete="name">':''}
 <label>Email address or phone number (international)</label><input id="f_email" type="text" inputmode="email" autocomplete="username" placeholder="name@example.com or +251911234567">
 <label>${forgot?'New password':'Password'}</label><input id="f_pass" type="password" autocomplete="${reg||forgot?'new-password':'current-password'}" placeholder="At least 6 characters">
 <p class="err ${msg.startsWith('✓')?'okmsg':''}" id="msg">${msg}</p>
 <button class="btn pri full" onclick="submitAuth()">${forgot?'Reset password':reg?'Register — start free trial':'Login'}</button>
 <p class="mute" style="text-align:center;margin:1rem 0 0">${forgot?'<button class="link" onclick="setMode(\'login\')">Back to login</button>':!reg?'<button class="link" onclick="setMode(\'forgot\')">Forgot password?</button>':''}</p>
 </div></div></div>`}
function setMode(m){mode=m;msg='';render()}
async function submitAuth(){
 const email=$('#f_email').value.trim().toLowerCase(),pass=$('#f_pass').value,name=$('#f_name')?$('#f_name').value.trim():'';
 const all=users();
 if(!/^\S+@\S+\.\S+$/.test(email))return fail('Please enter a valid email.');
 if(pass.length<6)return fail('Password must be at least 6 characters.');
 const h=await hash(pass);
 if(mode==='register'){
  if(!name)return fail('Please enter your name.');
  if(all[email])return fail('An account with this email already exists.');
  saveUser({name,email,hash:h,created:Date.now(),subUntil:0,role:email===ADMIN_EMAIL?'admin':'user'});
  sv('mb_session',email);view='profile';
 }else if(mode==='forgot'){
  if(!all[email])return fail('No account found with this email.');
  all[email].hash=h;sv('mb_users',all);mode='login';msg='✓ Password updated. Please log in.';return render();
 }else{
  if(!all[email]||all[email].hash!==h)return fail('Incorrect email or password.');
  sv('mb_session',email);view='profile';
 }
 msg='';view='profile';render()}
function fail(t){msg=t;const m=$('#msg');if(m){m.textContent=t;m.className='err'}}
function logout(){sv('mb_session',null);mode='login';msg='';render()}
async function uploadProfilePhoto(input){
 const file=input.files&&input.files[0];
 if(!file)return;
 if(!file.type.startsWith('image/')){alert('Please choose an image file.');return;}
 try{
  const bitmap=await createImageBitmap(file);
  const scale=Math.min(1,320/Math.max(bitmap.width,bitmap.height));
  const canvas=document.createElement('canvas');
  canvas.width=Math.round(bitmap.width*scale);
  canvas.height=Math.round(bitmap.height*scale);
  canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);
  bitmap.close();
  const u=me();
  if(!u)return;
  u.photo=canvas.toDataURL('image/jpeg',0.78);
  saveUser(u);
  render();
 }catch(e){alert('Could not save this photo. Please try another image.');}
}


const pages={
dash(u,s){
 const e=ld('mb_e_'+u.email,[]),inc=e.filter(x=>x.t==='in').reduce((a,x)=>a+x.a,0),exp=e.filter(x=>x.t==='out').reduce((a,x)=>a+x.a,0);
 return `<div class="top"><div><h2>Welcome, ${esc(u.name.split(' ')[0])} 👋</h2><span class="mute">Here’s your business overview</span></div><div style="display:flex;gap:.6rem;align-items:center;flex-wrap:wrap"><select aria-label="Display currency" onchange="setCurrency(this.value)" style="width:auto;margin:0"><option value="ETB" ${currency()==='ETB'?'selected':''}>ETB · Birr</option><option value="USD" ${currency()==='USD'?'selected':''}>USD · US Dollar</option></select><span class="badge ${s.cls}">${s.label}</span></div></div>
 <p class="mute">Display currency: ${currency()}${fxUpdated?' · Exchange rate updated '+fmt(fxUpdated):' · Waiting for exchange rate'}</p>
 ${banner(s)}
 <div class="grid"><div class="card stat"><span class="mute">Total income</span><b style="color:var(--ok)">${money(inc)}</b></div>
 <div class="card stat"><span class="mute">Total expenses</span><b style="color:var(--bad)">${money(exp)}</b></div>
 <div class="card stat"><span class="mute">Balance</span><b>${money(inc-exp)}</b></div>
 <div class="card stat"><span class="mute">${s.label==='Expired'?'Access':'Days remaining'}</span><b>${s.ok?s.days:'Locked'}</b></div></div>`},
tracker(u,s){
 if(!s.ok)return locked();
 const e=ld('mb_e_'+u.email,[]);
 return `<div class="top"><h2>Transactions</h2></div><div class="card"><div class="grid" style="align-items:end">
 <div><label>Description</label><input id="t_d"></div><div><label>Amount</label><input id="t_a" type="number" min="0" step="0.01" placeholder="Enter amount"></div>
 <div><label>Entry currency</label><select id="t_c"><option value="ETB">ETB · Birr</option><option value="USD">USD · US Dollar</option></select></div>
 <div><label>Type</label><select id="t_t"><option value="in">Income</option><option value="out">Expense</option></select></div>
 <div><button class="btn pri full" style="margin-bottom:.9rem" onclick="addEntry()">Add</button></div></div>
 <div class="scroll"><table><tr><th>Date</th><th>Description</th><th>Type</th><th>Amount</th><th></th></tr>
 ${e.map((x,i)=>`<tr><td>${fmt(x.d)}</td><td>${esc(x.n)}</td><td>${x.t==='in'?'Income':'Expense'}</td><td>${money(x.a)}</td><td><button class="btn sec sm" onclick="delEntry(${i})">✕</button></td></tr>`).join('')||'<tr><td colspan="5" class="mute">No transactions yet.</td></tr>'}</table></div></div>`},
pay(u,s){
 const mine=ld('mb_pay',[]).filter(p=>p.email===u.email).reverse();
 return `<div class="top"><h2>Subscription & Payment</h2><span class="badge ${s.cls}">${s.label}</span></div>${banner(s)}
 <div class="card"><h3>Subscription: 199 ETB / month</h3><p class="mute">Approximate USD price: ${usdPerEtb>0?'$'+(199*usdPerEtb).toFixed(2):'exchange rate unavailable'}. Payment is currently collected in ETB through the listed local methods. Send your payment using one of the options below, then submit the transaction reference. An admin will verify it and activate your subscription.</p>
 <div class="pay"><b>📱 Telebirr</b><br>Payment number: <code>+251911898184</code></div>
 <div class="pay"><b>🏦 Commercial Bank of Ethiopia (CBE)</b><br>Account number: <code>1000037200534</code></div>
 <h3 style="margin-top:1.2rem">Submit payment reference</h3>
 <div class="grid"><div><label>Method</label><select id="p_m"><option>Telebirr</option><option>CBE</option></select></div>
 <div><label>Amount paid (ETB)</label><input id="p_a" type="number" min="1" value="199"><small class="mute">199 ETB${usdEquivalent(199)}</small></div>
 <div><label>Transaction reference</label><input id="p_r" placeholder="e.g. CE12345ABC"></div></div>
 <p class="err" id="pmsg"></p><button class="btn pri" onclick="submitPay()">Submit for verification</button></div>
 <div class="card" style="margin-top:1rem"><h3>My payments</h3><div class="scroll"><table><tr><th>Date</th><th>Method</th><th>Ref</th><th>Amount</th><th>Status</th></tr>
 ${mine.map(p=>`<tr><td>${fmt(p.d)}</td><td>${p.m}</td><td>${esc(p.r)}</td><td>${p.a}</td><td><span class="badge ${p.s==='approved'?'b-ok':p.s==='rejected'?'b-bad':'b-warn'}">${p.s}</span></td></tr>`).join('')||'<tr><td colspan="5" class="mute">No payments submitted.</td></tr>'}</table></div></div>`},
profile(u,s){
 const photo=u.photo||'';
 const initial=esc((u.name||'?')[0].toUpperCase());
 return `<div class="top"><h2>My Profile</h2></div>
 <div class="card">
 <div style="display:flex;gap:1rem;align-items:center;margin-bottom:1rem">
 <div style="width:76px;height:76px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--p1);color:white;font-size:1.7rem;font-weight:800">
 ${photo?`<img src="${photo}" alt="Profile photo" style="width:100%;height:100%;object-fit:cover">`:initial}
 </div>
 <div><b>${esc(u.name)}</b><br><span class="mute">${u.loginType==='phone'?'Phone login':'Email login'}: ${esc(u.email)}</span></div>
 </div>
 <label for="profilePhoto">Profile picture</label>
 <input id="profilePhoto" type="file" accept="image/*" onchange="uploadProfilePhoto(this)">
 <p class="mute">Choose a photo from your device. Your picture is saved to this browser.</p>
 <p>Registered: <b>${fmt(u.created)}</b><br>Plan: <span class="badge ${s.cls}">${s.label}</span> until <b>${fmt(s.until)}</b><br>Role: <b>${u.role}</b></p>
 <div style="display:flex;gap:.6rem;flex-wrap:wrap">
 <button class="btn pri" onclick="location.href='index.html'">Continue to Dashboard</button>
 <button class="btn sec" onclick="expireTrial()">Demo: expire my trial</button>
 <button class="btn bad" onclick="logout()">Logout</button>
 </div></div>`
},
admin(u){
 if(u.role!=='admin')return '<div class="card">Admins only.</div>';
 const all=ld('mb_pay',[]).map((p,i)=>({...p,i})).reverse();
 return `<div class="top"><h2>Payment verification</h2></div><div class="card scroll"><table><tr><th>Date</th><th>User</th><th>Method</th><th>Ref</th><th>Amount</th><th>Status</th><th></th></tr>
 ${all.map(p=>`<tr><td>${fmt(p.d)}</td><td>${esc(p.email)}</td><td>${p.m}</td><td>${esc(p.r)}</td><td>${p.a}</td><td><span class="badge ${p.s==='approved'?'b-ok':p.s==='rejected'?'b-bad':'b-warn'}">${p.s}</span></td>
 <td>${p.s==='pending'?`<button class="btn ok sm" onclick="review(${p.i},1)">Approve</button> <button class="btn bad sm" onclick="review(${p.i},0)">Reject</button>`:''}</td></tr>`).join('')||'<tr><td colspan="7" class="mute">No payments yet.</td></tr>'}</table></div>
 <p class="mute">Approving adds 30 days of premium access to the user.</p>`}
};
function banner(s){
 if(s.label==='Premium active')return '';
 return s.ok?`<div class="banner grad"><div><b>🎁 Free trial: ${s.days} days left</b><br><span style="opacity:.9">Full access until ${fmt(s.until)}.</span></div><button class="btn sec" onclick="go('pay')">Subscribe now</button></div>`
 :`<div class="banner" style="background:var(--bad);color:#fff"><div><b>Your free trial has ended</b><br>Subscribe to continue using premium features.</div><button class="btn sec" onclick="go('pay')">Subscribe</button></div>`}
function locked(){return `<div class="card" style="text-align:center;padding:3rem 1.3rem"><div style="font-size:2.5rem">🔒</div><h2>Premium feature</h2><p class="mute">Your free trial has ended. Subscribe to continue.</p><button class="btn pri" onclick="go('pay')">View payment options</button></div>`}
function go(v){view=v;render();scrollTo(0,0)}
function addEntry(){const u=me(),n=$('#t_d').value.trim(),entered=parseFloat($('#t_a').value),cur=$('#t_c').value;if(!n||!(entered>0))return;
 if(cur==='USD'&&!(usdPerEtb>0)){alert('The USD exchange rate is unavailable. Please enter this transaction in ETB or try again when online.');return}
 const a=cur==='USD'?entered/usdPerEtb:entered;
 const e=ld('mb_e_'+u.email,[]);e.unshift({n,a,t:$('#t_t').value,d:Date.now(),entryCurrency:cur,entryAmount:entered});sv('mb_e_'+u.email,e);render()}
function delEntry(i){const u=me(),e=ld('mb_e_'+u.email,[]);e.splice(i,1);sv('mb_e_'+u.email,e);render()}
function submitPay(){const u=me(),a=parseFloat($('#p_a').value),r=$('#p_r').value.trim(),m=$('#p_m').value;
 if(!(a>0)||r.length<4){$('#pmsg').textContent='Enter the amount and a valid transaction reference.';return}
 const p=ld('mb_pay',[]);p.push({email:u.email,m,a,r,d:Date.now(),s:'pending'});sv('mb_pay',p);render()}
function review(i,ok){const p=ld('mb_pay',[]);p[i].s=ok?'approved':'rejected';sv('mb_pay',p);
 if(ok){const all=users(),t=all[p[i].email];if(t){t.subUntil=Math.max(Date.now(),t.subUntil||0)+30*DAY;sv('mb_users',all)}}render()}
function expireTrial(){const u=me();u.created=Date.now()-91*DAY;u.subUntil=0;saveUser(u);render()}

function appView(u){
 const s=status(u),items=[['dash','🏠','Dashboard'],['tracker','💼','Transactions'],['pay','💳','Payment'],['profile','👤','Profile']];
 if(u.role==='admin')items.push(['admin','🛡️','Admin']);
 return `<div class="app"><nav class="side"><div class="logo">MizanBiz</div>
 ${items.map(([k,i,l])=>`<button class="nav ${view===k?'on':''}" onclick="go('${k}')"><span>${i}</span>${l}</button>`).join('')}
 <button class="nav hide-m" style="margin-top:auto" onclick="logout()"><span>🚪</span>Logout</button></nav>
 <div><div class="main">${pages[view](u,s)}</div>${footer()}</div></div>`}
function render(){const u=me();$('#root').innerHTML=u?appView(u):authView()}
render();
loadFx().then(()=>{if(me())render()});
window.addEventListener('online',()=>loadFx().then(()=>{if(me())render()}));
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js")})}</script>
